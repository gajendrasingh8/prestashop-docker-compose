services:
  mysql:
    image: mysql:8.0
    container_name: ps_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
  prestashop:
    image: prestashop/prestashop:nightly-8.1   # Docker Hub pe available tags check kar lo
    container_name: ps_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      DB_SERVER: mysql
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWD: ${MYSQL_PASSWORD}
      ADMIN_MAIL: ${ADMIN_MAIL}
      ADMIN_PASSWD: ${ADMIN_PASSWD}
      PS_INSTALL_AUTO: 1
      PS_FOLDER_ADMIN: admin-demo
      PS_DOMAIN: localhost:8080
      PS_FOLDER_INSTALL: install-done
      PS_LANGUAGE: en
      PS_COUNTRY: IN
    volumes:
      - ps_data:/var/www/html
      - ./modules/dockerdemo:/var/www/html/modules/dockerdemo

volumes:
  db_data:
  ps_data: